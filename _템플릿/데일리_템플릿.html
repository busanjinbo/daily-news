<!DOCTYPE html>
<html lang="ko">
<head>

<!-- 정세브리핑 고정 템플릿. CSS 수정 금지. 자리표시자: {{TITLE}} {{KIND}} {{DATERANGE}} {{LEDE}} {{CONTENT}} {{FOOTNOTE}} {{GENERATED}} -->
<style>:root{--primary:#0066cc;--primary-on-dark:#2997ff;--ink:#1d1d1f;--ink-80:#333333;--ink-48:#7a7a7a;--on-dark:#ffffff;--body-muted:#cccccc;--canvas:#ffffff;--parchment:#f5f5f7;--pearl:#fafafc;--tile-1:#272729;--black:#000000;--divider:#f0f0f0;--hairline:#e0e0e0;--font-d:"SF Pro Display",system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;--font-t:"SF Pro Text",system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font-t);font-size:17px;font-weight:400;line-height:1.6;letter-spacing:-0.374px}.globalnav{background:var(--black);color:var(--on-dark);height:44px;display:flex;align-items:center;padding:0 24px;font-size:12px;letter-spacing:-0.12px}.globalnav .mark{font-family:var(--font-d);font-weight:600}.globalnav .spacer{flex:1}.globalnav .meta{color:#d2d2d7}.subnav{background:rgba(245,245,247,.8);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);height:52px;display:flex;align-items:center;padding:0 24px;border-bottom:1px solid rgba(0,0,0,.04);position:sticky;top:0;z-index:5}.subnav .cat{font-family:var(--font-d);font-size:21px;font-weight:600;line-height:1.6;letter-spacing:.231px}.subnav .spacer{flex:1}.subnav .range{font-size:14px;letter-spacing:-0.224px;color:var(--ink-80)}.tile{padding:80px 24px}.tile>.inner{max-width:980px;margin:0 auto}.tile.light{background:var(--canvas);color:var(--ink)}.tile.parchment{background:var(--parchment);color:var(--ink)}.tile.dark{background:var(--tile-1);color:var(--on-dark)}.hero h1{font-family:var(--font-d);font-size:56px;font-weight:600;line-height:1.07;letter-spacing:-0.28px;margin:0 0 24px}.hero .lede{font-family:var(--font-d);font-size:28px;font-weight:400;line-height:1.6;letter-spacing:.196px;color:var(--ink-80);margin:0}.hero .stamp{font-size:14px;letter-spacing:-0.224px;color:var(--ink-48);margin:24px 0 0}.tile-title{font-family:var(--font-d);font-size:40px;font-weight:600;line-height:1.6;margin:0 0 32px}.tile.dark .tile-title{color:var(--on-dark)}table.grid{width:100%;border-collapse:collapse;margin:0 0 8px;font-size:14px;line-height:1.6;letter-spacing:-0.224px}table.grid th{text-align:left;font-weight:600;padding:12px 12px 12px 0;border-bottom:1px solid var(--hairline)}table.grid td{vertical-align:top;padding:12px 12px 12px 0;border-bottom:1px solid var(--hairline)}table.grid td:first-child{white-space:nowrap;font-weight:600;width:1%}table.grid td.none{color:var(--ink-48);font-weight:400}.tile.dark table.grid th,.tile.dark table.grid td{border-bottom-color:rgba(255,255,255,.16)}.bar-row{display:flex;align-items:center;gap:12px;margin:0 0 10px}.bar-label{flex:1;min-width:0;font-size:14px;font-weight:600;letter-spacing:-0.224px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}.bar{width:120px;flex:none;height:6px;background:var(--divider);border-radius:9999px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--primary);border-radius:9999px}.bar-num{width:40px;flex:none;text-align:right;font-size:14px;color:var(--ink-48)}.tile.dark .bar{background:rgba(255,255,255,.16)}.tile.dark .bar>i{background:var(--primary-on-dark)}.tile.dark .bar-num{color:var(--body-muted)}.country{padding:32px 0;border-top:1px solid var(--hairline)}.country:first-of-type{border-top:0;padding-top:0}.tile.dark .country{border-top-color:rgba(255,255,255,.16)}.country-name{font-family:var(--font-d);font-size:34px;font-weight:600;line-height:1.6;letter-spacing:-0.374px;margin:0 0 12px}.main-head{font-size:21px;font-weight:600;line-height:1.6;letter-spacing:.231px;margin:0 0 4px;font-family:var(--font-d)}.main-head a{color:var(--primary);text-decoration:none}.tile.dark .main-head a{color:var(--primary-on-dark)}.byline{font-size:14px;letter-spacing:-0.224px;color:var(--ink-48);margin:0 0 12px}.tile.dark .byline{color:var(--body-muted)}.summary{margin:0 0 17px}.tile.dark .summary{color:var(--body-muted)}ul.related{list-style:none;margin:0;padding:0}ul.related li{font-size:14px;line-height:1.6;letter-spacing:-0.224px;padding:4px 0}ul.related a{color:var(--primary);text-decoration:none}.tile.dark ul.related a{color:var(--primary-on-dark)}ul.related .src{color:var(--ink-48)}.tile.dark ul.related .src{color:var(--body-muted)}ul.related li:before{content:"\21B3";color:var(--ink-48);margin-right:8px}ul.plain{margin:0;padding-left:20px}ul.plain li{padding:4px 0}.chip{display:inline-block;background:var(--pearl);color:var(--ink-80);font-size:12px;letter-spacing:-0.12px;line-height:1;padding:6px 12px;border-radius:9999px;border:1px solid var(--divider);vertical-align:middle}.tile.dark .chip{background:rgba(255,255,255,.12);color:var(--on-dark);border-color:transparent}a{color:var(--primary)}.tile.dark a{color:var(--primary-on-dark)}.note{font-size:14px;color:var(--ink-48);margin-top:17px}footer{background:var(--parchment);color:var(--ink-80);padding:64px 24px}footer .inner{max-width:980px;margin:0 auto}footer h4{font-size:14px;font-weight:600;line-height:1.29;letter-spacing:-0.224px;margin:0 0 12px}footer p{font-size:12px;line-height:1.6;letter-spacing:-0.12px;margin:0 0 8px}footer .legal{color:var(--ink-48);font-size:10px;line-height:1.6;letter-spacing:-0.08px;margin-top:24px}.highlights{margin-top:28px;padding-top:20px;border-top:1px solid var(--hairline)}.tile.dark .highlights{border-top-color:rgba(255,255,255,.16)}.highlights-title{font-size:14px;font-weight:600;letter-spacing:-0.224px;color:var(--ink-48);margin:0 0 10px}.tile.dark .highlights-title{color:var(--body-muted)}.highlights ul{margin:0;padding-left:20px}.highlights li{padding:4px 0;font-weight:500}@media (max-width:1068px){.hero h1{font-size:40px}}@media (max-width:834px){.tile{padding:48px 20px}.tile-title{font-size:34px}.country-name{font-size:28px}}@media (max-width:640px){.hero h1{font-size:34px}.hero .lede{font-size:21px;line-height:1.6}table.grid{font-size:13px}table.grid th,table.grid td{padding:10px 8px 10px 0}.bar{width:90px}}@media print{.globalnav,.subnav{display:none}.tile{padding:24px 0;break-inside:avoid}.tile.dark{background:#fff;color:#1d1d1f}.tile.dark .tile-title,.tile.dark .summary,.tile.dark .byline{color:#1d1d1f}.tile.dark a,.tile.dark .main-head a{color:#0066cc}.hero h1{font-size:32px}.hero .lede{font-size:17px}body{font-size:11pt}a{text-decoration:none}}</style>

<body>
<nav class="globalnav"><span class="mark">정세브리핑</span><span class="spacer"></span><span class="meta">{{KIND}}</span></nav>
<div class="subnav"><span class="cat">국제정세</span><span class="spacer"></span><span class="range">{{DATERANGE}}</span></div>

</div></section>
{{CONTENT}}
<footer><div class="inner">
<h4>수집 범위와 한계</h4>
{{FOOTNOTE}}
<p class="legal">생성: {{GENERATED}} · 수집 순서 민플러스 → 국내 언론(다음뉴스 경유) → 해외 매체 보완. 본문을 확인하지 못한 기사는 요약 없이 제목과 링크만 싣습니다.</p>
</div></footer>
</body>
</html>
